name: Deploy ESP32 web flasher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Mirror verified public XiaoZhi release ZIPs
        run: python3 mirror_releases.py --out "$RUNNER_TEMP/esp32-web-flasher-site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/esp32-web-flasher-site
      - id: deployment
        uses: actions/deploy-pages@v4
